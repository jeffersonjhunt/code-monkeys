# primates/fleet.conf — single source of truth for the primate fleet roster.
#
# Format: colon-delimited, one row per primate. Comment lines start with '#'.
# Parsed with `awk -F:` identically from primates/Makefile ($(shell …)), build-push.sh,
# manifest-push.sh, and zfuncs — no python/jq/helper binary anywhere in the fleet tooling.
#
#   name:chain:in_all:arches:push_default:manifest_default:home_volume
#
#   name              primate name (matches <name>.dockerfile, or root codemonkey.dockerfile)
#   chain             codemonkey | cuda | standalone   (base-image lineage; primates/CLAUDE.md)
#   in_all            yes/no — built by `make all` (primates/Makefile TARGETS). codemonkey itself
#                     is always built first regardless of this field; the Makefile special-cases it.
#   arches            comma-separated subset of {amd64,arm64} this image is PUBLISHED for
#                     (build-push.sh / manifest-push.sh). It does NOT gate `make all`, which builds
#                     whatever in_all=yes says on whatever host you run it on — so samba being
#                     amd64-only here and in_all=yes is not a contradiction, it is publish scope.
#   push_default      yes/no — build-push.sh's default run pushes this image's per-arch tag
#   manifest_default  yes/no — manifest-push.sh's default run assembles this image's multi-arch :latest
#   home_volume       yes/no — has a persistent <name>-home volume worth dotfile-syncing
#
# FORMATTING IS LOAD-BEARING: LF line endings, no trailing whitespace. The consumers strip spaces,
# tabs and CR defensively (a trailing space or a CRLF checkout would otherwise corrupt field 7, the
# last one, and silently drop a row from `make upgrade` while completion still listed it) — but
# .gitattributes pins eol=lf so it should never come to that.
#
# ROW ORDER IS SIGNIFICANT — every consumer's awk filter preserves file order, and that order is
# the BUILD order for `make all` and `build-push.sh`. The CPU chain is
# codemonkey → miniforge3 → {claude, opencode, aichat, kiro, spark-bench}, so miniforge3 must stay
# above every image that FROMs it. Do not alphabetize.
#
# push_default=no / manifest_default=no does NOT mean "never published" — nyckel, samba, and
# cuda-vllm all reach ECR, just via an explicit `./build-push.sh <name>` / `./manifest-push.sh
# <name>` (or, for cuda-vllm, the spark-cluster's own deploy pipeline — see spark/cluster/README.md
# and primates/CLAUDE.md's Exceptions list). It means "not swept up by a bare, argument-less run."
codemonkey:codemonkey:no:amd64,arm64:yes:yes:yes
minion:codemonkey:yes:amd64,arm64:yes:yes:yes
embedded:codemonkey:yes:amd64,arm64:yes:yes:yes
miniforge3:codemonkey:yes:amd64,arm64:yes:yes:yes
claude:codemonkey:yes:amd64,arm64:yes:yes:yes
opencode:codemonkey:yes:amd64,arm64:yes:yes:yes
aichat:codemonkey:yes:amd64,arm64:yes:yes:yes
kiro:codemonkey:yes:amd64,arm64:yes:yes:yes
lamp:codemonkey:yes:amd64,arm64:yes:yes:yes
huggingface:codemonkey:yes:amd64,arm64:yes:yes:yes
spark-bench:codemonkey:no:amd64:yes:yes:yes
nyckel:standalone:yes:amd64,arm64:no:no:no
samba:standalone:yes:amd64:no:no:no
cuda-base:cuda:no:amd64,arm64:no:no:no
cuda-comfy:cuda:no:amd64,arm64:no:yes:no
cuda-llama-cpp:cuda:no:amd64,arm64:no:yes:no
cuda-vllm:cuda:no:amd64,arm64:no:no:no
